[package]
name = "liveaudio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
liveaudio-ipc = { path = "../liveaudio-ipc" }
liveaudio-audio = { path = "../liveaudio-audio" }
liveaudio-vad = { path = "../liveaudio-vad" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
crossbeam-channel.workspace = true
reqwest = "0.13.2"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_DirectWrite", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
