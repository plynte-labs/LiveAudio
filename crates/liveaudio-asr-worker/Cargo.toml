[package]
name = "liveaudio-asr-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "liveaudio_asr_worker"
path = "src/lib.rs"

[[bin]]
name = "liveaudio-asr-worker"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
liveaudio-worker-protocol = { path = "../liveaudio-worker-protocol" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "half", "load-dynamic", "copy-dylibs", "api-17", "directml", "cuda"] }
half = "2"
ndarray = "0.17.2"
rustfft = "6.4.1"
dirs = "7.0.0"
reqwest = { version = "0.13.2", features = ["json", "stream"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
