schema: spec-driven

context: |
  Project: LiveAudio
  Stack: Python 3.13 desktop app with CustomTkinter UI, faster-whisper ASR, websockets, multiprocessing, JSON config, and OBS browser-source integration.
  Architecture: Local-first desktop transcription pipeline with audio capture, ASR worker, WebSocket broadcaster, persistent config, and session outputs.
  Testing: Strict TDD enabled. Current executable test runner is `python -m pytest -q`. Build validation command is `python -m compileall main.py core utils`.
  Conventions: Keep responses and planning concise, verify technical claims before asserting them, avoid exposing private paths or user data, and prefer safe public-release defaults.

rules:
  proposal:
    - Include user story, rollback plan, launch blockers, and explicit open questions.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Capture release-readiness requirements, not implementation trivia.
  design:
    - Trace each launch blocker to files, tests, docs, and release gates.
    - Document remediation order and public-release tradeoffs.
  tasks:
    - Keep tasks small, reviewable, and executable under strict TDD.
    - Separate repository-governance work from code/runtime fixes when possible.
  apply:
    - Follow strict TDD.
    - test_command: "python -m pytest -q"
    - build_command: "python -m compileall main.py core utils"
  verify:
    - test_command: "python -m pytest -q"
    - build_command: "python -m compileall main.py core utils"
    - coverage_threshold: 0
  archive:
    - Do not archive until manual launch-readiness checks and repo-governance decisions are closed.
