name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-prefix: windows-x64
          - os: ubuntu-22.04
            artifact-prefix: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio and Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned ONNX Runtime binaries
        run: node packaging/fetch_onnxruntime.mjs

      - name: Verify tag matches Cargo workspace version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="liveaudio-desktop") | .version')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo workspace version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build standalone release binaries
        run: cargo build --release --locked -p liveaudio-asr-worker -p liveaudio-cli

      - name: Prepare Tauri external sidecar binaries
        run: |
          TARGET_TRIPLE="$(rustc -vV | sed -n 's|host: ||p')"
          mkdir -p desktop/src-tauri/binaries
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp target/release/liveaudio-cli.exe "desktop/src-tauri/binaries/liveaudio-cli-${TARGET_TRIPLE}.exe"
            cp target/release/liveaudio-asr-worker.exe "desktop/src-tauri/binaries/liveaudio-asr-worker-${TARGET_TRIPLE}.exe"
          else
            cp target/release/liveaudio-cli "desktop/src-tauri/binaries/liveaudio-cli-${TARGET_TRIPLE}"
            cp target/release/liveaudio-asr-worker "desktop/src-tauri/binaries/liveaudio-asr-worker-${TARGET_TRIPLE}"
            chmod +x desktop/src-tauri/binaries/*
          fi

      - name: Install cargo-about (pinned)
        run: cargo install cargo-about --locked --version 0.9.3 --features cli

      - name: Generate third-party crate license notices
        run: node packaging/generate_licenses.mjs

      - name: Build Tauri desktop bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.1 build --config src-tauri/tauri.release.conf.json

      - name: Assemble updater manifest (latest.json)
        if: runner.os == 'Windows'
        run: |
          node packaging/assemble_latest_manifest.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --out-dir release_assets

      - name: Package Windows release assets
        if: runner.os == 'Windows'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release_assets
          # Find and copy NSIS installer and updater artifacts if not already staged
          find target/release/bundle/nsis desktop/src-tauri/target/release/bundle/nsis -type f -name "*.exe" -exec cp -n {} "release_assets/LiveAudio-Setup-${VERSION}.exe" \; 2>/dev/null || true
          find target/release/bundle/nsis desktop/src-tauri/target/release/bundle/nsis -type f -name "*.sig" -exec cp -n {} "release_assets/" \; 2>/dev/null || true
          
          # Standalone CLI + ASR worker zip package with DirectML.dll and onnxruntime.dll preserved
          STAGE="stage/LiveAudio-cli-${VERSION}-windows-x64"
          mkdir -p "$STAGE/onnxruntime"
          cp target/release/liveaudio-cli.exe "$STAGE/"
          cp target/release/liveaudio-asr-worker.exe "$STAGE/"
          cp -r packaging/onnxruntime/windows-x64 "$STAGE/onnxruntime/"
          # App-local VC++ runtime next to the exes (they link vcruntime140 dynamically)
          for d in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll; do
            cp "packaging/onnxruntime/windows-x64/$d" "$STAGE/" || (echo "Missing $d" && exit 1)
          done
          # Validate DirectML.dll and onnxruntime.dll are present
          test -f "$STAGE/onnxruntime/windows-x64/DirectML.dll" || (echo "Missing DirectML.dll in bundle" && exit 1)
          test -f "$STAGE/onnxruntime/windows-x64/onnxruntime.dll" || (echo "Missing onnxruntime.dll in bundle" && exit 1)
          test -f "$STAGE/onnxruntime/windows-x64/DirectML-LICENSE.txt" || (echo "Missing DirectML license in bundle" && exit 1)
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html README.md "$STAGE/"
          (cd stage && 7z a "../release_assets/liveaudio-cli-${VERSION}-windows-x64.zip" "LiveAudio-cli-${VERSION}-windows-x64")

      - name: Package Linux release assets
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release_assets
          # Collect AppImage / Deb bundles and updater signatures
          find target/release/bundle desktop/src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.AppImage.sig" -o -name "*.deb" \) -exec cp {} release_assets/ \; 2>/dev/null || true

          # Standalone CLI + ASR worker tarball package with ONNX Runtime CPU preserved
          STAGE="stage/LiveAudio-cli-${VERSION}-linux-x64"
          mkdir -p "$STAGE/onnxruntime"
          cp target/release/liveaudio-cli "$STAGE/"
          cp target/release/liveaudio-asr-worker "$STAGE/"
          cp -r packaging/onnxruntime/linux-x64 "$STAGE/onnxruntime/"
          test -f "$STAGE/onnxruntime/linux-x64/libonnxruntime.so.1.24.4" || (echo "Missing libonnxruntime.so in bundle" && exit 1)
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html README.md "$STAGE/"
          tar -czf "release_assets/liveaudio-cli-${VERSION}-linux-x64.tar.gz" -C stage "LiveAudio-cli-${VERSION}-linux-x64"

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-prefix }}
          path: release_assets/*
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "LiveAudio $GITHUB_REF_NAME" \
            --generate-notes \
            release_assets/*
