name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio and Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Verify bundled Silero model is tracked in the checkout
        shell: bash
        run: test -f crates/liveaudio-vad/models/silero_vad_v6.onnx

      - name: Verify native CPU runtime package closure
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            root="packaging/onnxruntime/windows-x64"
            test -f "$root/onnxruntime.dll"
            test -f "$root/onnxruntime_providers_shared.dll"
          else
            root="packaging/onnxruntime/linux-x64"
            test -f "$root/libonnxruntime.so.1.26.0"
            test -f "$root/libonnxruntime_providers_shared.so"
          fi
          test "$(tr -d '\r\n' < "$root/VERSION_NUMBER")" = "1.26.0"
          test -f "$root/LICENSE"
          test -f "$root/ThirdPartyNotices.txt"

      - name: Test locked Rust workspace
        run: cargo test --workspace --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install PortAudio runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies (CPU torch + dev group)
        run: uv sync --locked --extra cpu --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -vv --tb=short -o faulthandler_timeout=60

      - name: Launcher self-test
        env:
          LIVEAUDIO_INSTALL_ROOT: ${{ runner.temp }}/liveaudio-selftest
        run: uv run python packaging/launcher.py --self-test --headless
