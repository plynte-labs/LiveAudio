name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.6"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install PortAudio runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies (CPU torch + dev group)
        run: uv sync --locked --extra cpu --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Launcher self-test
        env:
          LIVEAUDIO_INSTALL_ROOT: ${{ runner.temp }}/liveaudio-selftest
        run: uv run python packaging/launcher.py --self-test --headless
