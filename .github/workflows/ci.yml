name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux audio and Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned ONNX Runtime binaries
        run: node packaging/fetch_onnxruntime.mjs

      - name: Verify bundled Silero model is tracked in the checkout
        shell: bash
        run: test -f crates/liveaudio-vad/models/silero_vad_v6.onnx

      - name: Verify native CPU runtime package closure
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            root="packaging/onnxruntime/windows-x64"
            test -f "$root/onnxruntime.dll"
            test -f "$root/onnxruntime_providers_shared.dll"
            test -f "$root/DirectML.dll"
            test -f "$root/DirectML-LICENSE.txt"
          else
            root="packaging/onnxruntime/linux-x64"
            test -f "$root/libonnxruntime.so.1.24.4"
            test -f "$root/libonnxruntime_providers_shared.so"
          fi
          test "$(tr -d '\r\n' < "$root/VERSION_NUMBER")" = "1.24.4"
          test -f "$root/LICENSE"
          test -f "$root/ThirdPartyNotices.txt"

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace --locked

  overlay-tests:
    name: Overlay JS & WCAG (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JS & WCAG contract test suite
        run: node --test tests-js/test_html_js.mjs tests-js/test_ribbon_js.mjs tests-js/test_wcag_contrast.mjs
