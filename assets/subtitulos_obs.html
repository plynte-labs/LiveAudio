<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subs Live</title>
    <style>
        /* --- CSS Custom Properties Theme Engine --- */
        /* SUBTITLE-STYLE:BEGIN (shared with the desktop Style tab preview; run node packaging/sync_overlay_preview_css.mjs after editing) */
        :root {
            --sub-bg: rgba(0, 0, 0, 0.7);
            --sub-color: #ffffff;
            --sub-font-size: 42px;
            --sub-font-weight: 900;
            --sub-radius: 10px;
            --sub-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            --sub-border: none;
            --sub-padding: 10px 20px;
            --sub-animation-duration: 0.3s;
            /* Time on screen (s). The overlay JS reads the same token (default SUB_LIFETIME_MS).
               The box enter/exit uses --sub-animation-duration, never the dwell time.
               Gentle Material-style easing avoids the abrupt snap on stacked changes. */
            --sub-lifetime: 5s;
            --sub-slide-ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
            --sub-slide-ease-in: cubic-bezier(0.4, 0.0, 1, 1);
            --sub-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --sub-text-transform: none;
            --sub-letter-spacing: normal;
            --sub-word-spacing: normal;
        }
        /* SUBTITLE-STYLE:END */

        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent !important; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            font-family: var(--sub-font-family);
            color: transparent; /* Oculta texto basura si algo falla */
        }

        #subtitle-container {
            width: 90%;
            max-width: 1800px;
            text-align: center;
            margin-bottom: 50px;
        }

        /* --- RIBBON: stack vertical, mas reciente ARRIBA (OD-1) --- */
        /* Aislado a UNA regla de direccion: un futuro flip a newest-bottom
           es cambiar column-reverse por column, sin impacto en el JS. */
        #subtitle-container.ribbon-active {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 8px;
        }

        /* SUBTITLE-STYLE:BEGIN */
        /* --- ESTILO BASE (Entrada y Salida unificadas) --- */
        .sub-box {
            display: inline-block;
            text-align: center !important;
            word-spacing: var(--sub-word-spacing, normal);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--sub-animation-duration) var(--sub-slide-ease-out), transform var(--sub-animation-duration) var(--sub-slide-ease-out);
        }

        .sub-box.visible {
            /* transform is intentionally NOT !important: .sub-box.visible already
               wins over .sub-box by specificity, and keeping it a normal author
               declaration lets the FLIP animation (element.animate, Animations
               cascade origin) override it during a reflow. An !important here would
               sit ABOVE the Animations origin and silently suppress the glide. */
            opacity: 1 !important;
            transform: translateY(0);
        }

        /* Salida suave: espejo exacto de la entrada (misma distancia, misma duración) */
        .sub-box.hiding {
            opacity: 0 !important;
            transform: translateY(10px) !important;
            transition: opacity var(--sub-animation-duration) var(--sub-slide-ease-in), transform var(--sub-animation-duration) var(--sub-slide-ease-in);
        }

        /* Box enter/exit follows the Style tab animation for every style:
           pop keeps the slide above, fade drops the movement, none shows and hides at once. */
        html[data-anim="fade"] .sub-box,
        html[data-anim="fade"] .sub-box.hiding {
            transform: none !important;
        }

        html[data-anim="none"] .sub-box,
        html[data-anim="none"] .sub-box.hiding {
            transition: none;
            transform: none !important;
        }

        /* --- ESTILO 1: DEFAULT --- */
        .style-default {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-user-padding, var(--sub-padding));
            background-color: var(--sub-bg);
            border-radius: var(--sub-user-radius, var(--sub-radius));
            text-shadow: var(--sub-shadow);
            border: var(--sub-user-border, var(--sub-border));
            text-transform: var(--sub-user-text-transform, var(--sub-text-transform));
            letter-spacing: var(--sub-user-letter-spacing, normal);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 2: KARAOKE (Palabra por palabra) --- */
        .style-karaoke {
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            color: var(--sub-user-color, #ffcc00); /* Amarillo brillante por defecto */
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            background-color: var(--sub-bg);
            padding: var(--sub-user-padding, var(--sub-padding));
            border-radius: var(--sub-user-radius, var(--sub-radius));
            border: var(--sub-user-border, none);
            text-transform: var(--sub-user-text-transform, none);
            letter-spacing: var(--sub-user-letter-spacing, normal);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        
        .style-karaoke .word {
            display: inline-block;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Karaoke salida: las palabras se desvanecen en cascada reversa */
        .style-karaoke.hiding .word {
            animation: popOut 0.15s ease-in forwards;
        }

        @keyframes popOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.7) translateY(8px); }
        }

        /* --- ESTILO 3: NEON --- */
        .style-neon {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-user-padding, 12px 24px);
            background: var(--sub-user-bg, rgba(0, 20, 20, 0.6));
            border: var(--sub-user-border, 2px solid #00ffff);
            border-radius: var(--sub-user-radius, 15px);
            box-shadow: 0 0 15px #00ffff, inset 0 0 10px #00ffff;
            text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
            text-transform: var(--sub-user-text-transform, uppercase);
            letter-spacing: var(--sub-user-letter-spacing, 2px);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 4: MINIMAL --- */
        .style-minimal {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-user-padding, 6px 14px);
            background-color: var(--sub-user-bg, rgba(0, 0, 0, 0.55));
            border-radius: var(--sub-user-radius, 4px);
            text-shadow: none;
            border: var(--sub-user-border, none);
            text-transform: var(--sub-user-text-transform, none);
            letter-spacing: var(--sub-user-letter-spacing, normal);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 5: BOLD --- */
        .style-bold {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-user-padding, 12px 24px);
            background-color: var(--sub-user-bg, rgba(0, 0, 0, 0.85));
            border-radius: var(--sub-user-radius, 8px);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: var(--sub-user-border, none);
            text-transform: var(--sub-user-text-transform, uppercase);
            letter-spacing: var(--sub-user-letter-spacing, 1px);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 6: RGB --- */
        .style-rgb {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-user-padding, var(--sub-padding));
            background-color: var(--sub-bg);
            border-radius: var(--sub-user-radius, var(--sub-radius));
            text-shadow: var(--sub-shadow);
            border: var(--sub-user-border, var(--sub-border));
            text-transform: var(--sub-user-text-transform, none);
            letter-spacing: var(--sub-user-letter-spacing, normal);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .style-rgb .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(10px);
            animation: rgbFadeIn 0.2s ease-out forwards;
        }

        @keyframes rgbFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .style-rgb.hiding .word {
            animation: rgbFadeOut 0.2s ease-in forwards;
        }

        @keyframes rgbFadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }

        /* --- ESTILO 7: TYPEWRITER --- */
        .style-typewriter {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            font-family: 'Courier New', Courier, monospace;
            padding: var(--sub-user-padding, var(--sub-padding));
            background-color: var(--sub-user-bg, rgba(0, 0, 0, 0.75));
            border-radius: var(--sub-user-radius, 2px);
            text-shadow: none;
            border: var(--sub-user-border, 1px solid rgba(255, 255, 255, 0.15));
            text-transform: var(--sub-user-text-transform, none);
            letter-spacing: var(--sub-user-letter-spacing, 1px);
            word-spacing: var(--sub-word-spacing, normal);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .style-typewriter .word {
            display: inline-block;
            opacity: 0;
            animation: typeIn 0.15s ease-out forwards;
        }

        @keyframes typeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* A custom font from the Style tab replaces the typewriter monospace only then. */
        html[data-font="custom"] .style-typewriter {
            font-family: var(--sub-font-family);
        }

        .style-typewriter::after {
            content: '|';
            animation: blink 0.8s step-end infinite;
            color: var(--sub-color);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Animation token (Style tab): word reveal override; "pop" keeps each preset's own --- */
        html[data-anim="fade"] .word {
            animation: subFade var(--sub-animation-duration) ease-out forwards;
            transform: none;
        }

        html[data-anim="none"] .word {
            animation: none;
            opacity: 1;
            transform: none;
        }

        @keyframes subFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        /* SUBTITLE-STYLE:END */

        @media (max-height: 220px) {
            #subtitle-container {
                margin-bottom: 18px;
            }

            .style-default,
            .style-karaoke,
            .style-neon,
            .style-minimal,
            .style-bold,
            .style-rgb,
            .style-typewriter {
                font-size: clamp(28px, 4.5vw, 36px);
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <div id="subtitle-container"></div>

    <script>
        const container = document.getElementById('subtitle-container');
        let partialNode = null; // provisional line: a normal .sub-box inside `container`
        let partialUtterance = null;
        let hideTimeout;
        let cleanupTimeout;
        let ws;
        const VALID_STYLES = new Set(['default', 'karaoke', 'neon', 'minimal', 'bold', 'rgb', 'typewriter']);
        const MAX_SUBTITLE_CHARS = 600;
        const VALID_DISPLAY_MODES = new Set(['single', 'ribbon', 'adaptive']);
        const SUB_LIFETIME_MS = 5000; // vida por defecto de cada linea (Track C); --sub-lifetime la sustituye
        let subLifetimeMs = SUB_LIFETIME_MS;
        let boxExitMs = 300; // --sub-animation-duration en ms; 0 con animacion none
        const RIBBON_MIN_LINES = 1;
        const RIBBON_MAX_LINES_CEILING = 8;
        const RIBBON_DEFAULT_LINES = 3;
        const WS_PORT_FALLBACK_RANGE = 10;
        const HELLO_TIMEOUT_MS = 2000;
        const WS_PROTO = 1;

        // --- URL Param Parser: read ?style= on load ---
        const urlParams = new URLSearchParams(window.location.search);
        const urlStyle = urlParams.get('style');
        let currentStyle = (urlStyle && VALID_STYLES.has(urlStyle)) ? urlStyle : null;

        // --- Mode resolution: ?mode= / ?lines= read AT LOAD and ACTUALLY used later ---
        // resolvedMode es leido en enqueueSubtitle (no es una variable muerta como currentStyle).
        const urlMode = urlParams.get('mode');
        let resolvedMode = (urlMode && VALID_DISPLAY_MODES.has(urlMode)) ? urlMode : 'adaptive';

        // ?lines=N override del cap visible, clamp defensivo 1..8 (la autoridad es config.py).
        function resolveRibbonMaxLines(raw) {
            const n = parseInt(raw, 10);
            if (Number.isNaN(n)) return RIBBON_DEFAULT_LINES;
            return Math.max(RIBBON_MIN_LINES, Math.min(RIBBON_MAX_LINES_CEILING, n));
        }
        let ribbonMaxLines = urlParams.has('lines')
            ? resolveRibbonMaxLines(urlParams.get('lines'))
            : RIBBON_DEFAULT_LINES;

        // Estado de la maquina adaptativa SINGLE<->RIBBON (solo si resolvedMode === 'adaptive').
        let adaptiveState = 'SINGLE';
        let replayActive = false;   // latch: true mientras llegan payloads is_replay
        let demoteTimer = null;     // settle window pendiente (DEBOUNCE_MS)

        // --- Replay-idle gating (anti-flap) ---
        // El latch replayActive NO debe limpiarse en un drenaje momentaneo entre dos
        // payloads is_replay espaciados (catch-up llega cada catchup_interval_sec, que
        // puede superar DEBOUNCE_MS). Si se limpiara, el settle timer dispararia en el
        // hueco, demotaria a SINGLE y el siguiente payload re-promoveria: FLAP visible.
        // Solo envejecemos el latch cuando el replay estuvo REALMENTE inactivo por una
        // ventana que EXCEDE el espaciado inter-replay, derivada de catchup_interval_sec.
        const REPLAY_IDLE_FLOOR_MS = 1500;   // piso de inactividad (>= 1 intervalo default)
        const REPLAY_IDLE_MARGIN_MS = 1000;  // margen sobre el intervalo configurado
        // Cota dura (subLifetimeMs - REPLAY_IDLE_MARGIN_MS): debe quedar por DEBAJO de la vida para que la demotion tras
        // silencio siga ocurriendo cuando las lineas expiran (no wedge en RIBBON).
        let lastReplayAt = 0;                // Date.now() del ultimo payload is_replay
        let replayIdleMs = REPLAY_IDLE_FLOOR_MS; // ventana de inactividad vigente

        /* THEME-ENGINE:BEGIN */
        // --- Theme Engine: CSS Custom Properties ---
        // Mirrors the Rust normalize() rules in liveaudio-core (the source of truth).
        // Defaults live in :root; a token missing from a theme falls back to them.
        const VALID_THEME_TOKENS = {
            '--sub-bg': { type: 'color' },
            '--sub-color': { type: 'color' },
            '--sub-font-size': { type: 'px', min: 12, max: 120 },
            '--sub-font-weight': { type: 'weight' },
            '--sub-radius': { type: 'px', min: 0, max: 50 },
            '--sub-shadow': { type: 'shadow' },
            '--sub-border': { type: 'border' },
            '--sub-padding': { type: 'padding' },
            '--sub-animation': { type: 'enum', values: ['pop', 'fade', 'none'] },
            '--sub-animation-duration': { type: 'seconds', default: '0.3s', min: 0.1, max: 2.0 },
            '--sub-lifetime': { type: 'seconds', min: 1.5, max: 15 },
            '--sub-font-family': { type: 'font' },
            '--sub-text-transform': { type: 'enum', values: ['none', 'uppercase', 'lowercase', 'capitalize'] },
            '--sub-letter-spacing': { type: 'spacing' },
            '--sub-word-spacing': { type: 'spacing' },
        };

        const CSS_NUMBER = '-?\\d+(?:\\.\\d+)?';
        const COLOR_RE = new RegExp(
            `^(#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})|rgba?\\(\\s*${CSS_NUMBER}%?(?:\\s*,\\s*${CSS_NUMBER}%?){2,3}\\s*\\))$`, 'i');
        const PX_RE = new RegExp(`^(${CSS_NUMBER})px$`);
        const SECONDS_RE = new RegExp(`^(${CSS_NUMBER})s$`);
        const SAFE_CSS_RE = /^[a-z0-9 #.,%()+\-'"]+$/i;
        const FONT_RE = /^[a-z0-9 \-,'"]+$/i;
        const WEIGHT_RE = /^(?:normal|bold|[1-9]00)$/;

        function inRange(text, re, min, max) {
            const match = text.match(re);
            if (!match) return false;
            const num = Number(match[1]);
            return num >= min && num <= max;
        }

        function isThemeValueValid(schema, value) {
            if (value.length > 200) return false;
            switch (schema.type) {
                case 'color':
                    return COLOR_RE.test(value);
                case 'px':
                    return inRange(value, PX_RE, schema.min, schema.max);
                case 'seconds':
                    return inRange(value, SECONDS_RE, schema.min, schema.max);
                case 'weight':
                    return WEIGHT_RE.test(value) && (value.length !== 3 || Number(value) >= 100 && Number(value) <= 900);
                case 'shadow':
                    return value === 'none' || (SAFE_CSS_RE.test(value) && !/url/i.test(value));
                case 'border': {
                    if (value === 'none') return true;
                    const match = value.match(/^(\S+) (solid|dashed|dotted|double) (.+)$/);
                    return !!match && inRange(match[1], PX_RE, 0, 20) && COLOR_RE.test(match[3].trim());
                }
                case 'padding': {
                    const parts = value.split(/\s+/);
                    return parts.length <= 4 && parts.every((part) => inRange(part, PX_RE, 0, 200));
                }
                case 'enum':
                    return schema.values.includes(value);
                case 'font':
                    return FONT_RE.test(value);
                case 'spacing':
                    return value === 'normal' || inRange(value, PX_RE, -5, 20);
                default:
                    return false;
            }
        }

        // A seconds token of a clean theme in ms, or null when absent or invalid.
        function themeSeconds(tokens, key) {
            const value = sanitizeThemeTokens(tokens)[key];
            return value === undefined ? null : parseFloat(value) * 1000;
        }

        function sanitizeThemeTokens(tokens) {
            const clean = {};
            if (!tokens || typeof tokens !== 'object') return clean;
            for (const [key, raw] of Object.entries(tokens)) {
                if (!Object.prototype.hasOwnProperty.call(VALID_THEME_TOKENS, key) || typeof raw !== 'string') continue;
                const value = raw.trim();
                if (isThemeValueValid(VALID_THEME_TOKENS[key], value)) {
                    clean[key] = value;
                } else {
                    console.warn(`Theme token rejected: ${key}`);
                }
            }
            return clean;
        }

        // A theme message is the full custom state: tokens it omits return to the :root defaults.
        function applyTheme(tokens) {
            const root = document.documentElement;
            const clean = sanitizeThemeTokens(tokens);
            for (const key of Object.keys(VALID_THEME_TOKENS)) {
                if (Object.prototype.hasOwnProperty.call(clean, key)) {
                    root.style.setProperty(key, clean[key]);
                } else {
                    root.style.removeProperty(key);
                }
            }
            // Presets with their own properties read these, so a user choice wins over them.
            const userOverrides = {
                '--sub-user-color': '--sub-color',
                '--sub-user-bg': '--sub-bg',
                '--sub-user-letter-spacing': '--sub-letter-spacing',
                '--sub-user-padding': '--sub-padding',
                '--sub-user-radius': '--sub-radius',
                '--sub-user-border': '--sub-border',
                '--sub-user-text-transform': '--sub-text-transform',
            };
            for (const [userKey, source] of Object.entries(userOverrides)) {
                if (Object.prototype.hasOwnProperty.call(clean, source)) {
                    root.style.setProperty(userKey, clean[source]);
                } else {
                    root.style.removeProperty(userKey);
                }
            }
            root.dataset.anim = clean['--sub-animation'] || 'pop';
            root.dataset.font = Object.prototype.hasOwnProperty.call(clean, '--sub-font-family') ? 'custom' : 'default';
        }
        /* THEME-ENGINE:END */

        // --- Backpressure: Debounce + Max Queue ---
        const MAX_PENDING_QUEUE = 5;
        const DEBOUNCE_MS = 80; // Minimum time between subtitle renders
        // Presupuesto total de aparición/desaparición escalonada por palabra (ms).
        // Acota el stagger acumulado para que cualquier frase termine de revelarse
        // dentro de este margen; solo acorta frases largas (las cortas no cambian).
        const REVEAL_BUDGET_MS = 400;
        let pendingQueue = [];
        let lastShowTime = 0;
        let isShowing = false;
        let debounceTimer = null;

        // --- Adaptive state machine helpers (SINGLE <-> RIBBON), §1.10-1.12 ---

        function setRibbonActive(on) {
            if (on) {
                container.classList.add('ribbon-active');
            } else {
                container.classList.remove('ribbon-active');
            }
        }

        // Re-arma timers per-linea sobre una caja existente por su vida RESTANTE.
        // Usado al adoptar la caja viva del path single durante la promocion.
        function adoptBoxIntoRibbon(box) {
            if (!box) return;
            // Cancela los timers COMPARTIDOS del path single para no matar su expiry.
            clearTimeout(hideTimeout);
            clearTimeout(cleanupTimeout);
            // Limpia cualquier timer per-linea previo de esta caja (idempotente).
            if (box._hideTimer) clearTimeout(box._hideTimer);
            if (box._cleanupTimer) clearTimeout(box._cleanupTimer);
            const bornAt = box._bornAt || Date.now();
            box._bornAt = bornAt;
            const remaining = Math.max(0, subLifetimeMs - (Date.now() - bornAt));
            armPerLineExpiry(box, remaining);
        }

        // Decide promote/demote para adaptive ANTES de encolar el nuevo item.
        // Devuelve true si la nueva linea debe renderizarse apilada (RIBBON).
        function resolveRenderStacked(isReplay, catchupIntervalSec) {
            if (resolvedMode === 'single') return false;
            if (resolvedMode === 'ribbon') {
                // ribbon fija el render apilado; el contenedor debe llevar column-reverse
                // (newest-on-top, OD-1) desde la primera linea.
                setRibbonActive(true);
                return true;
            }
            // adaptive: corre la maquina de estados.
            replayActive = !!isReplay;
            if (isReplay) {
                // Sella el instante del ultimo replay con el MISMO reloj que usa el resto
                // del codigo (el harness shimea Date.now()). La ventana de inactividad se
                // deriva del espaciado de catch-up configurado: idle = max(piso, intervalo
                // + margen), acotada por debajo de SUB_LIFETIME_MS para no wedgear.
                lastReplayAt = Date.now();
                const intervalMs = (Number(catchupIntervalSec) || 0) * 1000;
                replayIdleMs = Math.min(
                    subLifetimeMs - REPLAY_IDLE_MARGIN_MS,
                    Math.max(REPLAY_IDLE_FLOOR_MS, intervalMs + REPLAY_IDLE_MARGIN_MS)
                );
            }
            if (adaptiveState === 'SINGLE') {
                // PROMOTE edge-triggered: mas de un item esperando O replay activo.
                if (pendingQueue.length > 1 || isReplay) {
                    adaptiveState = 'RIBBON';
                    setRibbonActive(true);
                    // Re-arma el path single serializado: onSubtitleComplete (el UNICO
                    // sitio que resetea isShowing en el path single) ya no correra para
                    // las cajas adoptadas, asi que isShowing quedaria orphaned en true y
                    // tras una demotion el guard `if (!isShowing) processQueue()` estaria
                    // muerto para siempre, tragando lineas single. Lo limpiamos aqui.
                    isShowing = false;
                    if (debounceTimer) {
                        clearTimeout(debounceTimer);
                        debounceTimer = null;
                    }
                    // Adopta la caja viva del path single (si existe) al ribbon.
                    const live = container.querySelector('.sub-box');
                    if (live && live !== partialNode) adoptBoxIntoRibbon(live);
                }
            }
            return adaptiveState === 'RIBBON';
        }

        // Programa la demotion RIBBON->SINGLE tras una ventana de asentamiento
        // (DEBOUNCE_MS), solo si el drenaje SIGUE valido al disparar (§1.11).
        function scheduleDemoteCheck() {
            if (resolvedMode !== 'adaptive' || adaptiveState !== 'RIBBON') return;
            if (demoteTimer) clearTimeout(demoteTimer);
            demoteTimer = setTimeout(() => {
                demoteTimer = null;
                const liveCount = container.querySelectorAll('.sub-box').length;
                // El settle disparo sin que llegara trafico nuevo durante la ventana.
                // Si la cola esta drenada y el ribbon casi vacio Y el replay estuvo
                // REALMENTE inactivo por replayIdleMs (que excede el espaciado inter-replay),
                // envejecemos el latch. El guard temporal evita el FLAP: durante un replay
                // espaciado en curso lastReplayAt es reciente, el latch NO se limpia, y la
                // demotion no dispara entre dos payloads. Tras SILENCIO real (las lineas
                // expiran > replayIdleMs despues del ultimo replay), el latch envejece y
                // demote dispara — sin wedge, porque replayIdleMs < SUB_LIFETIME_MS.
                if (pendingQueue.length <= 1
                    && liveCount <= 1
                    && (Date.now() - lastReplayAt) > replayIdleMs) {
                    replayActive = false;
                }
                if (adaptiveState === 'RIBBON'
                    && pendingQueue.length <= 1
                    && liveCount <= 1
                    && !replayActive) {
                    adaptiveState = 'SINGLE';
                    setRibbonActive(false);
                    // La caja superviviente conserva sus timers per-linea (no se tocan).
                }
            }, DEBOUNCE_MS);
        }

        function enqueueSubtitle(text, style, isReplay, catchupIntervalSec) {
            const renderStacked = resolveRenderStacked(isReplay, catchupIntervalSec);

            if (renderStacked) {
                // RIBBON: la cola es la fuente del stack, no un buffer de descarte.
                // El cap VISIBLE (ribbonMaxLines), no MAX_PENDING_QUEUE, gobierna la
                // profundidad mostrada. Pero MAX_PENDING_QUEUE sigue siendo la valvula de
                // transporte (OD-4): una rafaga sostenida mas rapida que el pump no debe
                // crecer pendingQueue sin limite — descartamos el mas viejo pendiente.
                if (pendingQueue.length >= MAX_PENDING_QUEUE) {
                    pendingQueue.shift(); // Discard oldest pending (transport valve)
                }
                pendingQueue.push({ text, style, stacked: true });
                pumpRibbonQueue();
                return;
            }

            // SINGLE (legacy): backpressure serializado con descarte del mas viejo.
            if (pendingQueue.length >= MAX_PENDING_QUEUE) {
                pendingQueue.shift(); // Discard oldest
            }
            pendingQueue.push({ text, style, stacked: false });

            // If not currently showing, try to show immediately
            if (!isShowing) {
                processQueue();
            }
        }

        // Drena la cola apilando lineas (RIBBON), pausado por DEBOUNCE_MS para
        // evitar thrash visual en rafagas. No usa el gate isShowing.
        function pumpRibbonQueue() {
            if (pendingQueue.length === 0) return;
            const now = Date.now();
            const sinceLast = now - lastShowTime;
            if (sinceLast < DEBOUNCE_MS) {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const item = pendingQueue.shift();
                    if (item) {
                        showSubtitle(item.text, item.style, true);
                        lastShowTime = Date.now();
                    }
                    if (pendingQueue.length > 0) pumpRibbonQueue();
                    else scheduleDemoteCheck();
                }, DEBOUNCE_MS - sinceLast);
            } else {
                const item = pendingQueue.shift();
                if (item) {
                    showSubtitle(item.text, item.style, true);
                    lastShowTime = Date.now();
                }
                if (pendingQueue.length > 0) pumpRibbonQueue();
                else scheduleDemoteCheck();
            }
        }

        function processQueue() {
            if (pendingQueue.length === 0) {
                isShowing = false;
                return;
            }

            isShowing = true;
            const now = Date.now();
            const timeSinceLastShow = now - lastShowTime;

            try {
                if (timeSinceLastShow < DEBOUNCE_MS) {
                    // Debounce: wait before showing next subtitle
                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const item = pendingQueue.shift();
                        showSubtitle(item.text, item.style);
                        lastShowTime = Date.now();
                    }, DEBOUNCE_MS - timeSinceLastShow);
                } else {
                    // Show immediately
                    const item = pendingQueue.shift();
                    showSubtitle(item.text, item.style);
                    lastShowTime = Date.now();
                }
            } catch (e) {
                console.error("Error showing subtitle:", e);
                isShowing = false;
                // Try next after delay
                setTimeout(processQueue, 100);
            }
        }

        // Called when subtitle animation completes
        function onSubtitleComplete() {
            isShowing = false;
            processQueue(); // Process next in queue
        }

        const defaultPort = (typeof window !== 'undefined' && window.location && /^https?:$/i.test(window.location.protocol) && window.location.port)
            ? window.location.port
            : '8765';
        const requestedPort = parseInt(urlParams.get('port') || defaultPort, 10);
        const wsBasePort = Math.max(1, Math.min(65535, Number.isNaN(requestedPort) ? 8765 : requestedPort));
        const wsLastPort = Math.min(wsBasePort + WS_PORT_FALLBACK_RANGE - 1, 65535);
        let wsCandidate = wsBasePort;
        let wsBackoffMs = 1000;
        let wsState = 'CLOSED';

        function connect() {
            const candidate = wsCandidate;
            const wsPort = candidate;
            wsState = 'CONNECTING';
            const socket = new WebSocket(`ws://127.0.0.1:${wsPort}`);
            let helloTimer = null;
            ws = socket;

            socket.onopen = () => {
                if (ws !== socket) return;
                wsState = 'AWAIT_HELLO';
                helloTimer = setTimeout(() => {
                    if (ws === socket && wsState === 'AWAIT_HELLO') socket.close();
                }, HELLO_TIMEOUT_MS);
            };
            
            socket.onmessage = (event) => {
                if (ws !== socket) return;
                try {
                    const data = JSON.parse(event.data);
                    if (wsState !== 'ACTIVE') {
                        if (data && data.type === 'hello' && data.app === 'liveaudio' &&
                            Number.isInteger(data.proto) && data.proto >= WS_PROTO) {
                            clearTimeout(helloTimer);
                            wsState = 'ACTIVE';
                            wsBackoffMs = 1000;
                            return;
                        }
                        if (data && data.type === 'hello') socket.close();
                        return;
                    }
                    // Handle theme messages
                    if (data && data.type === 'theme' && data.tokens) {
                        applyTheme(data.tokens);
                        subLifetimeMs = themeSeconds(data.tokens, '--sub-lifetime') ?? SUB_LIFETIME_MS;
                        boxExitMs = data.tokens['--sub-animation'] === 'none' ? 0 : (themeSeconds(data.tokens, '--sub-animation-duration') ?? 300);
                        return;
                    }
                    // Provisional text: a typed frame without `text`, never queued as a final.
                    if (data && data.type === 'subtitle_partial') {
                        showPartial(data.utterance_id, data.partial_text);
                        return;
                    }
                    // Aseguramos que data sea un objeto con text y style
                    if (data && data.text) {
                        // is_replay alimenta la senal secundaria de la maquina adaptativa.
                        // catchup_interval_sec (el espaciado de catch-up) dimensiona la
                        // ventana de replay-idle para el anti-flap del latch.
                        enqueueSubtitle(
                            data.text,
                            data.style || 'default',
                            data.is_replay === true,
                            data.catchup_interval_sec
                        );
                    }
                } catch (e) {
                    console.error("Error parseando WebSocket:", e);
                }
            };

            socket.onclose = () => {
                clearTimeout(helloTimer);
                if (ws !== socket) return;
                const wasActive = wsState === 'ACTIVE';
                wsState = 'CLOSED';
                if (wasActive) {
                    wsCandidate = wsBasePort;
                } else if (candidate < wsLastPort) {
                    wsCandidate = candidate + 1;
                    setTimeout(connect, 0);
                    return;
                } else {
                    wsCandidate = wsBasePort;
                }
                const delay = wsBackoffMs;
                wsBackoffMs = Math.min(wsBackoffMs * 2, 8000);
                setTimeout(connect, delay);
            };
        }

        // 650 ms cubre el stagger por palabra; una salida de caja mas larga la alarga.
        function exitCleanupMs() {
            return Math.max(650, boxExitMs + 100);
        }

        // Aplica el stagger de salida por palabra (REVEAL_BUDGET_MS, identico a la entrada)
        // y programa la limpieza del nodo. Compartido por ambos paths (single y ribbon):
        // lo unico que difiere es el flag `stacked`, que decide si se pumpea la cola single.
        function runExpiry(sub, safeStyle, stacked) {
            sub.classList.add('hiding');
            sub.classList.remove('visible');

            // Si es karaoke, rgb o typewriter, escalonar la desaparición de las palabras.
            // Mismo presupuesto que la entrada (REVEAL_BUDGET_MS) para no truncar la cola.
            if (safeStyle === 'karaoke') {
                const words = sub.querySelectorAll('.word');
                const perWordDelay = Math.min(25, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    word.style.animationDelay = `${index * perWordDelay}ms`;
                });
            } else if (safeStyle === 'rgb') {
                const words = sub.querySelectorAll('.word');
                const perWordDelay = Math.min(50, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    word.style.animationDelay = `${index * perWordDelay}ms`;
                });
            } else if (safeStyle === 'typewriter') {
                const words = sub.querySelectorAll('.word');
                const perWordDelay = Math.min(40, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    word.style.animationDelay = `${index * perWordDelay}ms`;
                });
            }

            // Limpiar el nodo del DOM después de que termine la animación de salida.
            // 650ms = REVEAL_BUDGET_MS (400) + animación de salida por palabra (~200ms) + margen,
            // para que las palabras de la cola completen su fade antes de eliminar el nodo.
            const cleanupCb = () => {
                // Use removeChild for predictable GC
                if (sub.parentNode) {
                    sub.parentNode.removeChild(sub);
                }
                if (stacked) {
                    // RIBBON: GC per-linea, SIN re-pumpear la cola serializada (§1.12).
                    sub._hideTimer = sub._cleanupTimer = null;
                    // Cuando una linea apilada expira y el ribbon se vacia, re-evaluar
                    // la demotion para que adaptive colapse a SINGLE sin esperar otra linea.
                    scheduleDemoteCheck();
                } else {
                    // SINGLE: senalar a la cola que procese la siguiente.
                    onSubtitleComplete();
                }
            };

            if (stacked) {
                sub._cleanupTimer = setTimeout(cleanupCb, exitCleanupMs());
            } else {
                cleanupTimeout = setTimeout(cleanupCb, exitCleanupMs()); // >= REVEAL_BUDGET_MS + salida
            }
        }

        // Arma (o re-arma) el timer de hide per-linea de una caja stacked tras `delay` ms.
        // Reutilizado en la creacion normal del ribbon y en la ADOPCION de la caja viva
        // durante la promocion SINGLE->RIBBON (donde delay = vida restante).
        function armPerLineExpiry(sub, delay) {
            if (sub._hideTimer) clearTimeout(sub._hideTimer);
            sub._hideTimer = setTimeout(() => runExpiry(sub, sub._style || 'default', true), delay);
        }

        // --- FLIP: glide surviving ribbon lines to their new position instead of
        // letting them JUMP when the stack reflows (oldest evicted + new line
        // appended). Visual only — it animates a transform via the Web Animations
        // API and never touches any lifetime timer, so on-screen dwell is unchanged.
        // Values mirror the --sub-slide-* CSS so the glide matches the enter feel.
        const RIBBON_FLIP_MS = 400;                              // reflow glide, independent of the enter/exit duration
        const RIBBON_FLIP_EASE = 'cubic-bezier(0.0, 0.0, 0.2, 1)'; // == --sub-slide-ease-out

        // First pass: snapshot each current line's top BEFORE the reflow. Returns
        // empty (and disables FLIP) in a headless/no-layout environment.
        function captureRibbonRects(container) {
            const tops = new Map();
            for (const el of container.children) {
                if (typeof el.getBoundingClientRect !== 'function') return tops;
                tops.set(el, el.getBoundingClientRect().top);
            }
            return tops;
        }

        // Play pass: for every surviving line (present before AND after), animate it
        // from its old position to the new one. The just-added line is skipped — it
        // keeps its own enter animation.
        function flipPlayRibbon(container, firstTops, newEl) {
            if (!firstTops) return;
            for (const el of container.children) {
                if (el === newEl) continue;
                const firstTop = firstTops.get(el);
                if (firstTop === undefined) continue;
                if (typeof el.getBoundingClientRect !== 'function' || typeof el.animate !== 'function') continue;
                const dy = firstTop - el.getBoundingClientRect().top;
                if (!dy) continue;
                el.animate(
                    [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
                    { duration: RIBBON_FLIP_MS, easing: RIBBON_FLIP_EASE }
                );
            }
        }

        // --- Provisional subtitles: one .sub-box in the slot the final will take -----
        // Never enters pendingQueue and owns no timers; showSubtitle() swaps it for the final.
        function clearPartial() {
            if (partialNode && partialNode.parentNode) partialNode.parentNode.removeChild(partialNode);
            partialNode = null;
            partialUtterance = null;
        }

        function showPartial(utteranceId, text) {
            const safeText = String(text || '').replace(/\s+/g, ' ').trim().slice(0, MAX_SUBTITLE_CHARS)
                .replace(/[\u202E\u202D\u200E\u200F\u0000\u001b]/g, '');
            if (!safeText) {
                clearPartial();
                return;
            }
            if (!partialNode) {
                const style = (urlStyle && VALID_STYLES.has(urlStyle)) ? urlStyle : 'default';
                const ribbon = resolvedMode === 'ribbon' || (resolvedMode === 'adaptive' && adaptiveState === 'RIBBON');
                if (ribbon) {
                    setRibbonActive(true);
                } else {
                    // SINGLE: take the slot like a new final would, dropping the old final
                    // with its shared timers and releasing the serialized queue gate.
                    const old = container.querySelector('.sub-box');
                    if (old) {
                        clearTimeout(hideTimeout);
                        clearTimeout(cleanupTimeout);
                        isShowing = false;
                        container.removeChild(old);
                    }
                }
                partialNode = document.createElement('div');
                partialNode.className = `sub-box style-${style} visible`;
                container.appendChild(partialNode);
            }
            partialNode.textContent = safeText;
            partialUtterance = utteranceId;
        }

        function showSubtitle(text, style, renderStacked) {
            const chosenStyle = (urlStyle && VALID_STYLES.has(urlStyle)) ? urlStyle : style;
            const safeStyle = VALID_STYLES.has(chosenStyle) ? chosenStyle : 'default';
            // FLIP snapshot holder (ribbon path only); captured before the reflow.
            let flipFirst = null;
            let safeText = String(text || '').replace(/\s+/g, ' ').trim().slice(0, MAX_SUBTITLE_CHARS);
            // Strip dangerous Unicode: bidi overrides, control chars
            safeText = safeText.replace(/[\u202E\u202D\u200E\u200F\u0000\u001b]/g, '');
            // The final takes the provisional box's place in the same slot.
            const hadPartial = !!partialNode;
            clearPartial();

            if (!renderStacked) {
                // --- PATH SINGLE (legacy, byte-for-byte): timers compartidos + replace ---
                // Limpiar timers anteriores
                clearTimeout(hideTimeout);
                clearTimeout(cleanupTimeout);

                // Remove previous subtitle from DOM using removeChild (predictable GC)
                let existing = container.querySelector('.sub-box');
                if (existing) {
                    // §1.12 demotion edge: si la caja venia del path RIBBON (superviviente),
                    // limpiar sus timers per-linea para que un callback obsoleto no toque
                    // un nodo desprendido. No-op inofensivo para cajas single genuinas.
                    if (existing._hideTimer) clearTimeout(existing._hideTimer);
                    if (existing._cleanupTimer) clearTimeout(existing._cleanupTimer);
                    container.removeChild(existing);
                    existing = null; // Nullify reference for GC
                }
            } else {
                // --- PATH RIBBON: NO toca timers compartidos ni hace removeChild del previo ---
                // Cap eviction: si apilar excede el cap, evicta el MAS VIEJO primero.
                // La insercion es appendChild, asi que el orden de hijos en el DOM es
                // [mas viejo ... mas nuevo] y el mas viejo es firstElementChild.
                // column-reverse SOLO invierte el orden VISUAL, no el de los hijos del DOM.
                // FLIP first pass: snapshot positions BEFORE the stack reflows (the
                // eviction below + the new line appended later) so survivors glide.
                flipFirst = captureRibbonRects(container);
                while (container.children.length >= ribbonMaxLines) {
                    const oldest = container.firstElementChild;
                    if (!oldest) break;
                    // R-2: limpiar timers ANTES de removeChild, luego nulificar ids.
                    if (oldest._hideTimer) clearTimeout(oldest._hideTimer);
                    if (oldest._cleanupTimer) clearTimeout(oldest._cleanupTimer);
                    container.removeChild(oldest);
                    oldest._hideTimer = oldest._cleanupTimer = null;
                }
            }

            const sub = document.createElement('div');
            sub.className = `sub-box style-${safeStyle}`;
            sub._bornAt = Date.now(); // marca de nacimiento para adopcion (§1.12)
            sub._style = safeStyle;   // estilo persistido: el stagger de salida lo necesita tras adopcion
            
            if (safeStyle === 'karaoke') {
                // Generar spans para cada palabra
                const words = safeText.split(' ').filter(Boolean);
                // Escalonamos la aparición (25ms por palabra), acotado por REVEAL_BUDGET_MS
                // para que las frases largas terminen de revelarse dentro del presupuesto.
                const perWordDelay = Math.min(25, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    span.style.animationDelay = `${index * perWordDelay}ms`;
                    sub.appendChild(span);
                    
                    // Espacio entre palabras
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                // Forzar la visibilidad del contenedor principal inmediatamente
                sub.classList.add('visible');
                
            } else if (safeStyle === 'rgb') {
                // RGB: split into word spans with random HSL colors
                const words = safeText.split(' ').filter(Boolean);
                // Stagger de 50ms por palabra, acotado por REVEAL_BUDGET_MS en frases largas.
                const perWordDelay = Math.min(50, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    // Random HSL color with min luminance 40%
                    const hue = Math.floor(Math.random() * 360);
                    const saturation = 70 + Math.floor(Math.random() * 30); // 70-100%
                    const luminance = 40 + Math.floor(Math.random() * 25); // 40-65%
                    span.style.color = `hsl(${hue}, ${saturation}%, ${luminance}%)`;
                    span.style.animationDelay = `${index * perWordDelay}ms`;
                    sub.appendChild(span);
                    
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                sub.classList.add('visible');
                
            } else if (safeStyle === 'typewriter') {
                // Typewriter: split into word spans with staggered reveal
                const words = safeText.split(' ').filter(Boolean);
                // Stagger de 40ms por palabra, acotado por REVEAL_BUDGET_MS en frases largas.
                const perWordDelay = Math.min(40, REVEAL_BUDGET_MS / Math.max(words.length - 1, 1));
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    span.style.animationDelay = `${index * perWordDelay}ms`;
                    sub.appendChild(span);
                    
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                sub.classList.add('visible');
                
            } else {
                // Para Default y Neon, es texto plano. El reveal se programa tras
                // el appendChild (ver mas abajo): estos estilos transicionan por CSS
                // y necesitan que el estado inicial (opacity:0) este comprometido
                // ANTES de anadir .visible.
                sub.textContent = safeText;
            }

            container.appendChild(sub);

            // FLIP play pass: glide the surviving ribbon lines to their new
            // positions (no-op in single mode and in the headless harness).
            if (renderStacked) flipPlayRibbon(container, flipFirst, sub);

            // Reveal de los estilos que transicionan por CSS (default, neon, minimal,
            // bold). Los de @keyframes (karaoke, rgb, typewriter) ya se marcaron
            // .visible arriba de forma sincrona y no entran aqui.
            //
            // Leer offsetHeight fuerza un reflow SINCRONO, que compromete el estado
            // inicial (.sub-box -> opacity:0) antes de que el timer de 20ms anada
            // .visible; sin ese flush el navegador coalesce ambos estados y se salta
            // la transicion. Esto sustituye a un requestAnimationFrame: OBS CEF
            // SUSPENDE los callbacks de rAF mientras el documento esta oculto (escena
            // inactiva o pestana en segundo plano) mientras los setTimeout siguen
            // corriendo, asi que un reveal via rAF dejaba subtitulos invisibles para
            // siempre mientras sus timers de expiry si vencian.
            if (hadPartial) sub.classList.add('visible'); // replacing in place: no fade-in flicker
            if (!sub.classList.contains('visible')) {
                void sub.offsetHeight; // force reflow: flush the pre-transition state
                setTimeout(() => sub.classList.add('visible'), 20);
            }

            // --- Animación de salida unificada ---
            // El TIMING (5000ms hide / 650ms cleanup, stagger por palabra) es identico
            // en ambos paths (Track C). Lo unico que cambia es QUIEN posee el timer:
            // - stacked  -> timers per-linea (sub._hideTimer/_cleanupTimer), sin onSubtitleComplete.
            // - single   -> timers compartidos (hideTimeout/cleanupTimeout) + onSubtitleComplete.
            if (renderStacked) {
                armPerLineExpiry(sub, subLifetimeMs);
            } else {
                hideTimeout = setTimeout(() => runExpiry(sub, safeStyle, false), subLifetimeMs);
            }
        }

        // --- Reset duro al volver a ser visible ---------------------------------
        // Mientras el documento esta oculto (escena OBS inactiva o pestana en segundo
        // plano) el overlay SIGUE recibiendo por WebSocket y renderizando a ciegas.
        // Todo lo que quede en vuelo al reaparecer pertenece, por definicion, a audio
        // que el espectador ya se perdio. Regla de producto para toda salida de la app:
        // cuando una salida se reanuda, NUNCA reproduce lo que se perdio. Asi que al
        // volver a visible tiramos todo — sin revelarlo ni animarlo — y solo se
        // renderizan los subtitulos que lleguen DESPUES.
        function resetOverlayOnResume() {
            clearPartial();
            // Timers compartidos del path single + los de la maquina de estados.
            clearTimeout(hideTimeout);
            clearTimeout(cleanupTimeout);
            clearTimeout(debounceTimer);
            clearTimeout(demoteTimer);
            hideTimeout = cleanupTimeout = debounceTimer = demoteTimer = null;

            // Cajas vivas: se desprenden SIN anadir .visible ni .hiding, para que no
            // haya ni flash de entrada ni fade de salida al reaparecer la escena.
            for (const box of container.querySelectorAll('.sub-box')) {
                if (box._hideTimer) clearTimeout(box._hideTimer);
                if (box._cleanupTimer) clearTimeout(box._cleanupTimer);
                box._hideTimer = box._cleanupTimer = null;
                if (box.parentNode) box.parentNode.removeChild(box);
            }

            // Cola y gates del path single.
            pendingQueue = [];
            isShowing = false;
            lastShowTime = 0;
            // Maquina adaptativa: pizarra limpia en SINGLE, sin latch de replay vivo.
            adaptiveState = 'SINGLE';
            replayActive = false;
            lastReplayAt = 0;
            setRibbonActive(false);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) resetOverlayOnResume();
        });

        connect();
