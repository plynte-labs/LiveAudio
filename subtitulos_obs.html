<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subs Live</title>
    <style>
        /* --- CSS Custom Properties Theme Engine --- */
        :root {
            --sub-bg: rgba(0, 0, 0, 0.7);
            --sub-color: #ffffff;
            --sub-font-size: 38px;
            --sub-font-weight: bold;
            --sub-radius: 10px;
            --sub-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            --sub-border: none;
            --sub-padding: 10px 20px;
            --sub-animation-duration: 0.2s;
            --sub-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --sub-text-transform: none;
            --sub-letter-spacing: normal;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent !important; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            font-family: var(--sub-font-family);
            color: transparent; /* Oculta texto basura si algo falla */
        }

        #subtitle-container {
            width: 90%;
            max-width: 1800px;
            text-align: center;
            margin-bottom: 50px;
        }

        /* --- ESTILO BASE (Entrada y Salida unificadas) --- */
        .sub-box {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity var(--sub-animation-duration) ease-out, transform var(--sub-animation-duration) ease-out;
        }

        .sub-box.visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* Salida suave: espejo exacto de la entrada (misma distancia, misma duración) */
        .sub-box.hiding {
            opacity: 0 !important;
            transform: translateY(20px) !important;
            transition: opacity var(--sub-animation-duration) ease-in, transform var(--sub-animation-duration) ease-in;
        }

        /* --- ESTILO 1: DEFAULT --- */
        .style-default {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-padding);
            background-color: var(--sub-bg);
            border-radius: var(--sub-radius);
            text-shadow: var(--sub-shadow);
            border: var(--sub-border);
            text-transform: var(--sub-text-transform);
            letter-spacing: var(--sub-letter-spacing);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 2: KARAOKE (Palabra por palabra) --- */
        .style-karaoke {
            font-size: calc(var(--sub-font-size) * 1.15);
            font-weight: 900;
            color: #ffcc00; /* Amarillo brillante */
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            background-color: var(--sub-bg);
            padding: var(--sub-padding);
            border-radius: var(--sub-radius);
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        
        .style-karaoke .word {
            display: inline-block;
            margin-right: 12px;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Karaoke salida: las palabras se desvanecen en cascada reversa */
        .style-karaoke.hiding .word {
            animation: popOut 0.15s ease-in forwards;
        }

        @keyframes popOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.7) translateY(8px); }
        }

        /* --- ESTILO 3: NEON --- */
        .style-neon {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: 12px 24px;
            background: rgba(0, 20, 20, 0.6);
            border: 2px solid #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ffff, inset 0 0 10px #00ffff;
            text-shadow: 0 0 8px #00ffff, 0 0 20px #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 4: MINIMAL --- */
        .style-minimal {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: 300;
            padding: 6px 14px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            text-shadow: none;
            border: none;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 5: BOLD --- */
        .style-bold {
            color: #ffffff;
            font-size: calc(var(--sub-font-size) * 1.1);
            font-weight: 900;
            padding: 12px 24px;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* --- ESTILO 6: RGB --- */
        .style-rgb {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            padding: var(--sub-padding);
            background-color: var(--sub-bg);
            border-radius: var(--sub-radius);
            text-shadow: var(--sub-shadow);
            border: var(--sub-border);
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .style-rgb .word {
            display: inline-block;
            margin-right: 8px;
            opacity: 0;
            transform: translateY(10px);
            animation: rgbFadeIn 0.2s ease-out forwards;
        }

        @keyframes rgbFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .style-rgb.hiding .word {
            animation: rgbFadeOut 0.2s ease-in forwards;
        }

        @keyframes rgbFadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }

        /* --- ESTILO 7: TYPEWRITER --- */
        .style-typewriter {
            color: var(--sub-color);
            font-size: var(--sub-font-size);
            font-weight: var(--sub-font-weight);
            font-family: 'Courier New', Courier, monospace;
            padding: var(--sub-padding);
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 2px;
            text-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .style-typewriter .word {
            display: inline-block;
            margin-right: 8px;
            opacity: 0;
            animation: typeIn 0.15s ease-out forwards;
        }

        @keyframes typeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .style-typewriter::after {
            content: '|';
            animation: blink 0.8s step-end infinite;
            color: var(--sub-color);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-height: 220px) {
            #subtitle-container {
                margin-bottom: 18px;
            }

            .style-default,
            .style-karaoke,
            .style-neon,
            .style-minimal,
            .style-bold,
            .style-rgb,
            .style-typewriter {
                font-size: clamp(24px, 4vw, 34px);
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <div id="subtitle-container"></div>

    <script>
        const container = document.getElementById('subtitle-container');
        let hideTimeout;
        let cleanupTimeout;
        let ws;
        const VALID_STYLES = new Set(['default', 'karaoke', 'neon', 'minimal', 'bold', 'rgb', 'typewriter']);
        const MAX_SUBTITLE_CHARS = 600;

        // --- URL Param Parser: read ?style= on load ---
        const urlParams = new URLSearchParams(window.location.search);
        const urlStyle = urlParams.get('style');
        let currentStyle = (urlStyle && VALID_STYLES.has(urlStyle)) ? urlStyle : null;

        // --- Theme Engine: CSS Custom Properties ---
        const VALID_THEME_TOKENS = {
            '--sub-bg': { type: 'color', default: 'rgba(0, 0, 0, 0.7)' },
            '--sub-color': { type: 'color', default: '#ffffff' },
            '--sub-font-size': { type: 'size', default: '38px', min: 12, max: 120 },
            '--sub-font-weight': { type: 'weight', default: 'bold' },
            '--sub-radius': { type: 'size', default: '10px', min: 0, max: 50 },
            '--sub-shadow': { type: 'shadow', default: '2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000' },
            '--sub-border': { type: 'border', default: 'none' },
            '--sub-padding': { type: 'padding', default: '10px 20px' },
            '--sub-animation-duration': { type: 'duration', default: '0.4s', min: 0.1, max: 2.0 },
            '--sub-font-family': { type: 'font', default: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" },
            '--sub-text-transform': { type: 'transform', default: 'none' },
            '--sub-letter-spacing': { type: 'spacing', default: 'normal' },
        };

        function validateThemeToken(key, value) {
            if (!VALID_THEME_TOKENS[key]) return false;
            const schema = VALID_THEME_TOKENS[key];
            if (schema.type === 'size' || schema.type === 'duration') {
                const num = parseFloat(value);
                if (isNaN(num)) return false;
                if (schema.min !== undefined && num < schema.min) return false;
                if (schema.max !== undefined && num > schema.max) return false;
            }
            return true;
        }

        function applyTheme(tokens) {
            const root = document.documentElement;
            for (const [key, value] of Object.entries(tokens)) {
                if (validateThemeToken(key, value)) {
                    root.style.setProperty(key, value);
                } else {
                    console.warn(`Theme token rejected: ${key}=${value}`);
                }
            }
        }

        // --- Backpressure: Debounce + Max Queue ---
        const MAX_PENDING_QUEUE = 5;
        const DEBOUNCE_MS = 80; // Minimum time between subtitle renders
        let pendingQueue = [];
        let lastShowTime = 0;
        let isShowing = false;
        let debounceTimer = null;

        function enqueueSubtitle(text, style) {
            // If queue is full, discard oldest (backpressure)
            if (pendingQueue.length >= MAX_PENDING_QUEUE) {
                pendingQueue.shift(); // Discard oldest
            }
            pendingQueue.push({ text, style });
            
            // If not currently showing, try to show immediately
            if (!isShowing) {
                processQueue();
            }
        }

        function processQueue() {
            if (pendingQueue.length === 0) {
                isShowing = false;
                return;
            }

            isShowing = true;
            const now = Date.now();
            const timeSinceLastShow = now - lastShowTime;

            try {
                if (timeSinceLastShow < DEBOUNCE_MS) {
                    // Debounce: wait before showing next subtitle
                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const item = pendingQueue.shift();
                        showSubtitle(item.text, item.style);
                        lastShowTime = Date.now();
                    }, DEBOUNCE_MS - timeSinceLastShow);
                } else {
                    // Show immediately
                    const item = pendingQueue.shift();
                    showSubtitle(item.text, item.style);
                    lastShowTime = Date.now();
                }
            } catch (e) {
                console.error("Error showing subtitle:", e);
                isShowing = false;
                // Try next after delay
                setTimeout(processQueue, 100);
            }
        }

        // Called when subtitle animation completes
        function onSubtitleComplete() {
            isShowing = false;
            processQueue(); // Process next in queue
        }

        function connect() {
            // Read port from query parameter (?port=XXXX), default to 8765
            const params = new URLSearchParams(window.location.search);
            const wsPort = params.get('port') || '8765';
            const wsUrl = `ws://127.0.0.1:${wsPort}`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => console.log('Conectado al motor ASR');
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Handle theme messages
                    if (data && data.type === 'theme' && data.tokens) {
                        applyTheme(data.tokens);
                        return;
                    }
                    // Aseguramos que data sea un objeto con text y style
                    if (data && data.text) {
                        enqueueSubtitle(data.text, data.style || 'default');
                    }
                } catch (e) {
                    console.error("Error parseando WebSocket:", e);
                }
            };

            ws.onclose = () => {
                console.log('Desconectado. Reintentando...');
                setTimeout(connect, 3000);
            };
        }

        function showSubtitle(text, style) {
            const safeStyle = VALID_STYLES.has(style) ? style : 'default';
            let safeText = String(text || '').replace(/[\r\n\t]+/g, ' ').trim().slice(0, MAX_SUBTITLE_CHARS);
            // Strip dangerous Unicode: bidi overrides, control chars
            safeText = safeText.replace(/[\u202E\u202D\u200E\u200F\u0000\u001b]/g, '');

            // Limpiar timers anteriores
            clearTimeout(hideTimeout);
            clearTimeout(cleanupTimeout);
            
            // Remove previous subtitle from DOM using removeChild (predictable GC)
            let existing = container.querySelector('.sub-box');
            if (existing) {
                container.removeChild(existing);
                existing = null; // Nullify reference for GC
            }
            
            const sub = document.createElement('div');
            sub.className = `sub-box style-${safeStyle}`;
            
            if (safeStyle === 'karaoke') {
                // Generar spans para cada palabra
                const words = safeText.split(' ');
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    // Escalonamos la aparición (50ms por palabra)
                    span.style.animationDelay = `${index * 0.025}s`;
                    sub.appendChild(span);
                    
                    // Espacio entre palabras
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                // Forzar la visibilidad del contenedor principal inmediatamente
                sub.classList.add('visible');
                
            } else if (safeStyle === 'rgb') {
                // RGB: split into word spans with random HSL colors
                const words = safeText.split(' ');
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    // Random HSL color with min luminance 40%
                    const hue = Math.floor(Math.random() * 360);
                    const saturation = 70 + Math.floor(Math.random() * 30); // 70-100%
                    const luminance = 40 + Math.floor(Math.random() * 25); // 40-65%
                    span.style.color = `hsl(${hue}, ${saturation}%, ${luminance}%)`;
                    span.style.animationDelay = `${index * 0.05}s`;
                    sub.appendChild(span);
                    
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                sub.classList.add('visible');
                
            } else if (safeStyle === 'typewriter') {
                // Typewriter: split into word spans with staggered reveal
                const words = safeText.split(' ');
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = word;
                    // Staggered animation delay (40ms per word)
                    span.style.animationDelay = `${index * 40}ms`;
                    sub.appendChild(span);
                    
                    if (index < words.length - 1) {
                        const space = document.createTextNode(' ');
                        sub.appendChild(space);
                    }
                });
                
                sub.classList.add('visible');
                
            } else {
                // Para Default y Neon, es texto plano
                sub.textContent = safeText;
                
                // Pequeño timeout para permitir que el DOM se actualice antes de animar
                requestAnimationFrame(() => {
                    setTimeout(() => sub.classList.add('visible'), 20);
                });
            }
            
            container.appendChild(sub);

            // --- Animación de salida unificada ---
            hideTimeout = setTimeout(() => {
                sub.classList.add('hiding');
                sub.classList.remove('visible');
                
                // Si es karaoke, rgb o typewriter, escalonar la desaparición de las palabras
                if (safeStyle === 'karaoke') {
                    const words = sub.querySelectorAll('.word');
                    words.forEach((word, index) => {
                        word.style.animationDelay = `${index * 0.025}s`;
                    });
                } else if (safeStyle === 'rgb') {
                    const words = sub.querySelectorAll('.word');
                    words.forEach((word, index) => {
                        word.style.animationDelay = `${index * 0.025}s`;
                    });
                } else if (safeStyle === 'typewriter') {
                    const words = sub.querySelectorAll('.word');
                    words.forEach((word, index) => {
                        word.style.animationDelay = `${index * 0.025}s`;
                    });
                }
                
                // Limpiar el nodo del DOM después de que termine la animación de salida
                cleanupTimeout = setTimeout(() => {
                    // Use removeChild for predictable GC
                    if (sub.parentNode) {
                        sub.parentNode.removeChild(sub);
                    }
                    // Signal queue to process next subtitle
                    onSubtitleComplete();
                }, 350); // Debe ser >= duración de la transición de salida
                
            }, 5000);
        }

        connect();
    </script>
</body>
</html>
