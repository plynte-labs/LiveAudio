# cargo-about configuration for the Rust crate license notices (THIRD_PARTY_LICENSES.html).
# Generated by packaging/generate_licenses.mjs. The output is gitignored and produced in CI and
# at release time; the release config ships it as an installer resource.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Dev-only dependencies are never compiled into the shipped binaries.
ignore-dev-dependencies = true

# Licenses that occur in the shipped dependency graph for these targets. A license expression such
# as "MIT OR Apache-2.0" is satisfied by any accepted alternative. A new license in the graph fails
# generation on purpose: review its terms before adding it here.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# First-party workspace crates set publish = false; [private] ignore skips them, so they need
# no clarify entry and no notice.
[private]
ignore = true

# Clarifications for crates whose license text cargo-about cannot match to a file. Without them the
# notice falls back to the SPDX template, which carries placeholders (<owner>, <year>). Each checksum
# pins the exact bytes reviewed: if a crate version changes its license file, cargo-about logs a
# warning and falls back to file scanning. Crates that do not package their license file are read
# from the upstream repository at the commit they were published from (raw.githubusercontent.com),
# so generation needs network access for those entries.

# Packaged LICENSE: the file is a composite notice (ISC, Apache-2.0, MIT and BSD-3-Clause texts).
[aws-lc-sys.clarify]
license = "ISC AND Apache-2.0 AND MIT AND BSD-3-Clause"

[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

